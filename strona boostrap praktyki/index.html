<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LOGOWANIE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron&family=Metal+Mania&family=Atkinson+Hyperlegible+Mono:wght@400;700&display=swap">
    <script src="js/scripts.js"></script>
</head>
<body>
    <div class="vignette"></div>
    
    <div id="beforelogin" class="login-container">
        <div id="loginform"></div>
        <div class="form-wrapper font3">
            <p class="text-center fs-3">Welcome User!</p>
            <form>
                <div class="mb-3">
                    <label for="Email1" class="form-label">E-Mail:</label>
                    <input type="email" class="form-control" id="Email1" required>
                </div>
                <div class="mb-3">
                    <label for="pass1" class="form-label">Password:</label>
                    <input type="password" class="form-control" id="pass1" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-outline-light mt-2" onclick="submitlogin()">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <div id="afterlogin">
        <div class="dashboard-layout">
            <nav id="menumain" class="sidebar">
                <div class="sidebar-header">
                    <h3 style="font-family: 'Orbitron', sans-serif;">DASHBOARD</h3>
                </div>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><a href="#" class="nav-link active">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Statystyki</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Użytkownicy</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Ustawienia</a></li>
                </ul>
            </nav>

            <main id="sectionmain" class="main-content">
                <div class="content-card">
                    <h2 class="mb-4">Główny Moduł</h2>
                    <hr style="border-color: rgba(255,255,255,0.1);">
                    <div class="placeholder-box"></div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
